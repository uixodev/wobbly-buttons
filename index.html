<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wobbly buttons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wobbly-buttons.css" />
  <link rel="stylesheet" href="vira-logo.css" />
  <link rel="stylesheet" href="ink-cursor.css" />
  <link rel="stylesheet" href="nav.css" />
  <style>
    body { margin: 0; min-height: 100vh; background: var(--bg); }
    main { display: grid; place-content: center; gap: 72px; padding: 96px 24px 80px; }
    .row { display: flex; flex-wrap: wrap; gap: 64px; justify-content: center; }
  </style>
</head>
<body>
  <header class="site-nav">
    <a href="#" class="vira-logo" data-text="vira"></a>
    <nav aria-label="Main">
      <ul class="nav-links">
        <li><a href="#work">Work</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#playground">Playground</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
    <div class="nav-meta"><span class="nav-loc">[ Bristol, UK ]</span><span class="nav-dot" aria-hidden="true"></span></div>
  </header>
  <main>
  <div class="row">
    <a href="#work" class="wobbly" data-variant="solid">View my work <span aria-hidden="true">→</span></a>
    <a href="#talk" class="wobbly" data-variant="outline">Let’s talk <span aria-hidden="true">→</span></a>
  </div>
  </main>
  <script type="module" src="wobbly-buttons.js"></script>
  <script type="module" src="vira-logo.js"></script>
  <script type="module" src="ink-cursor.js"></script>
</body>
</html>
